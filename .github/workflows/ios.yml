name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ios/**"
      - "lib/**"
      - "pubspec.*"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release GitHub à compléter avec l'IPA (ex. v0.2.0) ; vide = artefact seulement"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  ios:
    name: iOS (non signé)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        id: pkg
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="$INPUT_TAG"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          NAME="ela-${TAG:-$VERSION}-unsigned.ipa"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry "$NAME" Payload
          shasum -a 256 "$NAME" > SHA256SUMS-ios
          cat SHA256SUMS-ios
          ls -l
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ela-ipa-unsigned
          if-no-files-found: error
          path: |
            build/ipa/*.ipa
            build/ipa/SHA256SUMS-ios
      - name: Attach IPA to GitHub release
        if: steps.pkg.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Ela $TAG" --notes "Ela $TAG"
          gh release upload "$TAG" build/ipa/*.ipa build/ipa/SHA256SUMS-ios --clobber
